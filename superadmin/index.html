<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Super Admin Dashboard · N&D'S</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../assets/css/role-dashboard.css"></head><body><script type="module">
import { requireRole } from '../role-auth.js';
const requiredRole = 'SUPER_ADMIN';
const user = await requireRole(requiredRole);
if (!user) throw new Error('Role guard redirected');
const esc = (v='') => String(v).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const money = (v,c='USD') => { try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(Number(v||0));}catch{return `${c} ${Number(v||0).toFixed(2)}`;} };
const api = async (path, options={}) => { const token=JSON.parse(localStorage.getItem('nds.auth')||'{}').accessToken; const r=await fetch(`/api${path}`,{...options,credentials:'include',headers:{Authorization:`Bearer ${token}`,...(options.headers||{})}}); const j=await r.json(); if(!r.ok) throw new Error(j.error||`Request failed (${r.status})`); return j; };
const root=document.body; root.innerHTML=`<div class="role-shell"><aside class="role-sidebar"><div class="role-brand">N&D'S Super Admin<small>Platform Control Center</small></div><nav class="role-nav"><a href="#dashboard">Dashboard</a><a href="#tenants">Tenants</a><a href="#plans">Platform Plans</a><a href="#analytics">Platform Analytics</a><a href="#billing">Billing & Subscriptions</a><button id="logout">Sign out</button></nav><div class="role-footer">Platform-level access only</div></aside><div class="role-main"><header class="role-topbar"><strong>Super Admin Dashboard</strong><span class="role-user">${esc(user.name)} · ${esc(user.role)}</span></header><main class="role-content"><div id="app"></div></main></div></div>`;
const app=document.querySelector('#app');
document.querySelector('#logout').onclick=()=>import('../role-auth.js').then(m=>m.signOut());
async function dashboard(){ app.innerHTML=`<section class="role-head"><div><h1>Platform Dashboard</h1><p>Manage the N&D'S SaaS platform without entering the business Admin Dashboard.</p></div></section><div class="role-grid" id="stats"><div class="role-card">Loading…</div></div><div class="role-grid two"><section class="role-card"><h2>Platform controls</h2><div class="role-list"><a class="role-row" href="#tenants"><span><strong>Tenants</strong><small>Provision and review businesses.</small></span><span>→</span></a><a class="role-row" href="#plans"><span><strong>Platform Plans</strong><small>Create and manage subscription plans.</small></span><span>→</span></a><a class="role-row" href="#analytics"><span><strong>Analytics</strong><small>Review platform adoption.</small></span><span>→</span></a></div></section><section class="role-card"><h2>System health</h2><div id="health">Checking…</div></section></div>`; try{const o=await api('/saas/overview'); document.querySelector('#stats').innerHTML=[['Businesses',o.data.businesses],['Active subscriptions',o.data.activeSubscriptions],['Trials',o.data.trials],['Suspended',o.data.suspendedBusinesses]].map(([l,v])=>`<article class="role-card"><div class="role-label">${l}</div><div class="role-value">${v}</div></article>`).join('');}catch(e){document.querySelector('#stats').innerHTML=`<div class="role-card role-alert error">${esc(e.message)}</div>`;} try{const r=await fetch('/health');document.querySelector('#health').innerHTML=r.ok?'<div class="role-alert success">API is healthy and responding.</div>':'<div class="role-alert error">API health check failed.</div>';}catch{document.querySelector('#health').innerHTML='<div class="role-alert error">API health check failed.</div>';}}
async function tenants(){ app.innerHTML=`<section class="role-head"><div><h1>Tenants</h1><p>Platform-level business provisioning and subscription status.</p></div></section><section class="role-card"><div id="tenantsTable">Loading…</div></section>`; try{const [b,p]=await Promise.all([api('/saas/businesses'),api('/saas/plans')]); app._plans=p.data; document.querySelector('#tenantsTable').innerHTML=`<table class="role-table"><thead><tr><th>Business</th><th>Status</th><th>Plan</th><th>Users</th><th>Customers</th><th>Products</th><th>Bookings</th><th>Subscription</th></tr></thead><tbody>${b.data.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><small>${esc(x.slug)}</small></td><td>${esc(x.status)}</td><td>${esc(x.subscription?.plan?.name||'—')}</td><td>${x.counts?.users??0}</td><td>${x.counts?.customers??0}</td><td>${x.counts?.products??0}</td><td>${x.counts?.bookings??0}</td><td>${esc(x.subscription?.status||'—')}</td></tr>`).join('')||'<tr><td colspan="8">No tenants yet.</td></tr>'}</tbody></table>`;}catch(e){document.querySelector('#tenantsTable').innerHTML=`<div class="role-alert error">${esc(e.message)}</div>`;}}
async function plans(){ app.innerHTML=`<section class="role-head"><div><h1>Platform Plans</h1><p>Only Super Admin can create or change platform plans.</p></div></section><section class="role-grid" id="plansGrid">Loading…</section>`; try{const p=await api('/saas/plans');document.querySelector('#plansGrid').innerHTML=p.data.map(x=>`<article class="role-card"><div class="role-label">${x.isActive?'Active':'Inactive'}</div><h2>${esc(x.name)}</h2><p>${esc(x.description||'')}</p><div class="role-value small">${money(x.price,x.currency)} <span class="role-label">/ ${esc(x.interval)}</span></div><div style="margin-top:14px"><span class="role-badge ${x.isActive?'success':'danger'}">${x.isActive?'Available to tenants':'Inactive'}</span></div></article>`).join('')||'<div class="role-card">No platform plans configured.</div>';}catch(e){document.querySelector('#plansGrid').innerHTML=`<div class="role-card role-alert error">${esc(e.message)}</div>`;}}
async function analytics(){ app.innerHTML=`<section class="role-head"><div><h1>Platform Analytics</h1><p>SaaS adoption and subscription snapshot.</p></div></section><div class="role-grid" id="analyticsGrid">Loading…</div>`;try{const [o,p,b]=await Promise.all([api('/saas/overview'),api('/saas/plans'),api('/saas/businesses')]);const active=p.data.filter(x=>x.isActive).length;app.querySelector('#analyticsGrid').innerHTML=[['Businesses',o.data.businesses],['Active subscriptions',o.data.activeSubscriptions],['Trials',o.data.trials],['Active plans',active],['Suspended',o.data.suspendedBusinesses]].map(([l,v])=>`<article class="role-card"><div class="role-label">${l}</div><div class="role-value">${v}</div></article>`).join('')+`<section class="role-card" style="grid-column:1/-1"><h2>Plan distribution</h2><div class="role-list">${p.data.map(x=>`<div class="role-row"><span><strong>${esc(x.name)}</strong><small>${esc(x.interval)} · ${money(x.price,x.currency)}</small></span><strong>${b.data.filter(y=>y.subscription?.plan?.id===x.id).length}</strong></div>`).join('')||'<div class="role-empty">No plans.</div>'}</div></section>`;}catch(e){app.querySelector('#analyticsGrid').innerHTML=`<div class="role-card role-alert error">${esc(e.message)}</div>`;}}
async function billing(){ app.innerHTML=`<section class="role-head"><div><h1>Billing & Subscriptions</h1><p>Platform subscription status across tenants.</p></div></section><section class="role-card"><div id="billingRows">Loading…</div></section>`;try{const {data}=await api('/saas/businesses');document.querySelector('#billingRows').innerHTML=`<table class="role-table"><thead><tr><th>Business</th><th>Plan</th><th>Subscription</th><th>Business status</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.subscription?.plan?.name||'—')}</td><td>${esc(x.subscription?.status||'No subscription')}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="4">No tenants yet.</td></tr>'}</tbody></table>`;}catch(e){document.querySelector('#billingRows').innerHTML=`<div class="role-alert error">${esc(e.message)}</div>`;}}
function route(){const r=location.hash.slice(1)||'dashboard';({dashboard,tenants,plans,analytics,billing}[r]||dashboard)();} addEventListener('hashchange',route); route();
</script></body></html>
