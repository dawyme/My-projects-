<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - N&amp;D's</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;family=Open+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4CPWJYXKQH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-4CPWJYXKQH');
</script>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo"><a href="index.html"><img src="assets/logo.png" alt="N&amp;D's" class="site-logo" width="512" height="512"></a></div>
                <nav class="main-nav">
                    <button class="nav-toggle"><span class="hamburger"></span></button>
                    <ul class="nav-menu" id="primary-menu">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products/index.html">Products</a></li>
                        <li><a href="cart.html" class="active">Cart</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="page-header">
        <div class="container"><h1>Your Cart</h1></div>
    </section>

    <section style="padding:60px 0;">
        <div class="container">
            <div id="cartContent">
                <!-- Populated by JS -->
            </div>
            <div id="cartEmpty" style="display:none; text-align:center; padding:80px 20px;">
                <i class="fas fa-shopping-cart fa-5x" style="color:#ddd;"></i>
                <h3 style="margin:30px 0 12px;">Your cart is empty</h3>
                <a href="products/index.html" class="btn-primary">Browse Products</a>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container"><div class="footer-bottom"><p>© 2026 N&amp;D's. All rights reserved.</p></div></div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        const escCart = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        function renderCart() {
            const container = document.getElementById('cartContent');
            const empty = document.getElementById('cartEmpty');
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            if (!cart.length) {
                container.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            container.style.display = 'block';
            empty.style.display = 'none';
            
            let html = `<div style="max-width:920px;margin:0 auto;"><table style="width:100%; border-collapse:collapse;"><thead><tr style="border-bottom:2px solid #ddd;"><th style="text-align:left;padding:14px;">Product</th><th style="padding:14px;">Price</th><th style="padding:14px;">Qty</th><th style="padding:14px;">Total</th><th></th></tr></thead><tbody>`;
            
            let subtotal = 0;
            cart.forEach((item, index) => {
                const total = Number(item.price || 0) * (item.quantity || 1);
                subtotal += total;
                html += `<tr style="border-bottom:1px solid #eee;">
                    <td style="padding:16px;">${escCart(item.name)}</td>
                    <td style="padding:16px;">$${Number(item.price || 0).toFixed(2)}</td>
                    <td style="padding:16px;"><input type="number" value="${escCart(item.quantity || 1)}" min="1" style="width:60px; padding:6px;" onchange="updateQuantity(${index}, this.value)"></td>
                    <td style="padding:16px;">$${total.toFixed(2)}</td>
                    <td style="padding:16px;"><button onclick="removeFromCart(${index})" aria-label="Remove ${escCart(item.name)} from cart" style="background:none;border:none;color:#e74c3c;cursor:pointer;"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            });
            
            html += `</tbody></table>
            <div style="margin-top:40px; text-align:right;">
                <p style="font-size:1.4rem; font-weight:700;">Subtotal: $${subtotal.toFixed(2)}</p>
                <a href="checkout.html" class="btn-primary btn-large" style="margin-top:20px;">Proceed to Checkout</a>
            </div></div>`;
            
            container.innerHTML = html;
        }
        
        function updateQuantity(index, qty) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart[index].quantity = parseInt(qty);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            window.updateCartCount && window.updateCartCount();
        }
        
        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            window.updateCartCount && window.updateCartCount();
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            if (window.updateCartCount) window.updateCartCount();
        });
    </script>
</body>
</html>
