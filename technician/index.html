<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Technician Dashboard · N&D'S</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../assets/css/role-dashboard.css"></head><body><script type="module">
import { requireRole, signOut } from '../role-auth.js';
const requiredRole = 'TECHNICIAN';
const user = await requireRole(requiredRole); if (!user) throw new Error('Role guard redirected');
const esc=(v='')=>String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); const api=async(p,o={})=>{const a=JSON.parse(localStorage.getItem('nds.auth')||'{}');const r=await fetch('/api'+p,{...o,credentials:'include',headers:{Authorization:`Bearer ${a.accessToken}`,...(o.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j;};
document.body.innerHTML=`<div class="role-shell"><aside class="role-sidebar"><div class="role-brand">N&D'S Technician<small>Field Service Portal</small></div><nav class="role-nav"><a href="#dashboard">My Dashboard</a><a href="#jobs">My Jobs</a><a href="/booking.html">Book Service</a><a href="/">View website</a><button id="logout">Sign out</button></nav><div class="role-footer">Technician access only</div></aside><div class="role-main"><header class="role-topbar"><strong>Technician Dashboard</strong><span class="role-user">${esc(user.name)}</span></header><main class="role-content"><div id="app"></div></main></div></div>`;document.querySelector('#logout').onclick=signOut;const app=document.querySelector('#app');
async function jobs(){app.innerHTML='<section class="role-head"><div><h1>My Jobs</h1><p>Only work assigned to your technician account is shown here.</p></div></section><section class="role-card"><div id="jobs">Loading…</div></section>';try{const {data}=await api('/technician-portal/overview');document.querySelector('#jobs').innerHTML=`<div class="role-list">${data.jobs.map(j=>`<div class="role-row"><span><strong>${esc(j.reference)}</strong><small>${esc(j.service?.name||'Service')} · ${esc(j.customer?.name||'Customer')} · ${new Date(j.scheduledAt).toLocaleString()}</small></span><span class="role-badge">${esc(j.status)}</span></div>`).join('')||'<div class="role-empty">No assigned jobs.</div>'}</div>`;}catch(e){document.querySelector('#jobs').innerHTML=`<div class="role-alert error">${esc(e.message)}</div>`;}}
async function dashboard(){app.innerHTML='<section class="role-head"><div><h1>Welcome, '+esc(user.name)+'</h1><p>Your field-service work, separate from the Admin Dashboard.</p></div><div class="role-actions"><a class="role-btn" href="#jobs">View my jobs</a></div></section><div class="role-grid" id="stats">Loading…</div><section class="role-card" style="margin-top:16px"><h2>Next appointments</h2><div id="upcoming">Loading…</div></section>';try{const {data}=await api('/technician-portal/overview');document.querySelector('#stats').innerHTML=[['Assigned jobs',data.counts.total],['Upcoming',data.counts.upcoming],['In progress',data.counts.inProgress],['Completed',data.counts.completed]].map(([l,v])=>`<article class="role-card"><div class="role-label">${l}</div><div class="role-value">${v}</div></article>`).join('');document.querySelector('#upcoming').innerHTML=`<div class="role-list">${data.upcoming.map(j=>`<div class="role-row"><span><strong>${esc(j.reference)}</strong><small>${esc(j.customer?.name||'Customer')} · ${new Date(j.scheduledAt).toLocaleString()}</small></span><span>${esc(j.status)}</span></div>`).join('')||'<div class="role-empty">No upcoming appointments.</div>'}</div>`;}catch(e){document.querySelector('#stats').innerHTML=`<div class="role-card role-alert error">${esc(e.message)}</div>`;}}
function route(){const r=location.hash.slice(1)||'dashboard';(r==='jobs'?jobs:dashboard)();}addEventListener('hashchange',route);route();
</script></body></html>
