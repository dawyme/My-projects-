<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customer Dashboard · N&D'S</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../assets/css/role-dashboard.css"></head><body><script type="module">
import { requireRole, signOut } from '../role-auth.js';
const requiredRole = 'CUSTOMER';
const user = await requireRole(requiredRole); if (!user) throw new Error('Role guard redirected');
const esc=(v='')=>String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); const api=async(p,o={})=>{const a=JSON.parse(localStorage.getItem('nds.auth')||'{}');const r=await fetch('/api'+p,{...o,credentials:'include',headers:{Authorization:`Bearer ${a.accessToken}`,...(o.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j;};
document.body.innerHTML=`<div class="role-shell"><aside class="role-sidebar"><div class="role-brand">N&D'S Customer<small>Customer Portal</small></div><nav class="role-nav"><a href="#dashboard">Dashboard</a><a href="#services">My Services</a><a href="#orders">My Orders</a><a href="/booking.html">Book a Service</a><a href="/">View website</a><button id="logout">Sign out</button></nav><div class="role-footer">Your account only</div></aside><div class="role-main"><header class="role-topbar"><strong>Customer Dashboard</strong><span class="role-user">${esc(user.name)}</span></header><main class="role-content"><div id="app"></div></main></div></div>`;document.querySelector('#logout').onclick=signOut;const app=document.querySelector('#app');
async function load(){try{return (await api('/customer-portal/overview')).data;}catch(e){app.innerHTML=`<div class="role-card role-alert error">${esc(e.message)}</div>`;throw e;}}
async function dashboard(){app.innerHTML='<section class="role-head"><div><h1>Welcome, '+esc(user.name)+'</h1><p>Your service history and orders are private to your customer account.</p></div><a class="role-btn" href="/booking.html">Book a Service</a></section><div class="role-grid" id="stats">Loading…</div><div class="role-grid two"><section class="role-card"><h2>Upcoming services</h2><div id="services">Loading…</div></section><section class="role-card"><h2>Recent orders</h2><div id="orders">Loading…</div></section></div>';try{const d=await load();document.querySelector('#stats').innerHTML=[['Total services',d.counts.bookings],['Upcoming',d.counts.upcoming],['Completed',d.counts.completed],['Orders',d.counts.orders]].map(([l,v])=>`<article class="role-card"><div class="role-label">${l}</div><div class="role-value">${v}</div></article>`).join('');document.querySelector('#services').innerHTML=`<div class="role-list">${d.bookings.map(b=>`<div class="role-row"><span><strong>${esc(b.reference)}</strong><small>${esc(b.service?.name||'Service')} · ${new Date(b.scheduledAt).toLocaleString()}</small></span><span class="role-badge">${esc(b.status)}</span></div>`).join('')||'<div class="role-empty">No services yet.</div>'}</div>`;document.querySelector('#orders').innerHTML=`<div class="role-list">${d.orders.map(o=>`<div class="role-row"><span><strong>${esc(o.reference)}</strong><small>${new Date(o.createdAt).toLocaleDateString()}</small></span><span>${esc(o.status)}</span></div>`).join('')||'<div class="role-empty">No orders yet.</div>'}</div>`;}catch{} }
async function list(kind){const d=await load();const rows=kind==='services'?d.bookings.map(b=>`<div class="role-row"><span><strong>${esc(b.reference)}</strong><small>${esc(b.service?.name||'Service')} · ${new Date(b.scheduledAt).toLocaleString()}</small></span><span>${esc(b.status)}</span></div>`):d.orders.map(o=>`<div class="role-row"><span><strong>${esc(o.reference)}</strong><small>${new Date(o.createdAt).toLocaleDateString()}</small></span><span>${esc(o.status)}</span></div>`);app.innerHTML=`<section class="role-head"><div><h1>${kind==='services'?'My Services':'My Orders'}</h1><p>Records belonging to your customer account.</p></div></section><section class="role-card"><div class="role-list">${rows.join('')||'<div class="role-empty">Nothing to show yet.</div>'}</div></section>`;}
function route(){const r=location.hash.slice(1)||'dashboard';(r==='services'?()=>list('services'):r==='orders'?()=>list('orders'):dashboard)();}addEventListener('hashchange',route);route();
</script></body></html>
