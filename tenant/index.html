<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Business Dashboard · N&D'S</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../assets/css/role-dashboard.css"></head><body><script type="module">
import { requireRole, signOut } from '../role-auth.js';
const requiredRole = 'TENANT_ADMIN';
const user = await requireRole(requiredRole); if (!user) throw new Error('Role guard redirected');
const esc=(v='')=>String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); const api=async(p,o={})=>{const a=JSON.parse(localStorage.getItem('nds.auth')||'{}');const r=await fetch('/api'+p,{...o,credentials:'include',headers:{Authorization:`Bearer ${a.accessToken}`,...(o.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j;};
document.body.innerHTML=`<div class="role-shell"><aside class="role-sidebar"><div class="role-brand">N&D'S Business<small>Tenant Portal</small></div><nav class="role-nav"><a href="#dashboard">Dashboard</a><a href="#subscription">Plans & Subscription</a><a href="/">View website</a><button id="logout">Sign out</button></nav><div class="role-footer">Business account</div></aside><div class="role-main"><header class="role-topbar"><strong>Business Dashboard</strong><span class="role-user">${esc(user.name)} · ${esc(user.role)}</span></header><main class="role-content"><div id="app"></div></main></div></div>`;document.querySelector('#logout').onclick=signOut;const app=document.querySelector('#app');
async function dashboard(){app.innerHTML='<section class="role-head"><div><h1>Business Dashboard</h1><p>Manage your organization and subscription from your own portal.</p></div></section><div class="role-grid" id="stats">Loading…</div><section class="role-card" style="margin-top:16px"><h2>Subscription</h2><div id="sub">Loading…</div></section>';try{const {data:o}=await api('/tenant/overview');document.querySelector('#stats').innerHTML=[['Business',o.name],['Customers',o._count.customers],['Team members',o._count.users],['Bookings',o._count.bookings],['Orders',o._count.orders],['Products',o._count.products]].map(([l,v])=>`<article class="role-card"><div class="role-label">${l}</div><div class="role-value small">${esc(v)}</div></article>`).join('');document.querySelector('#sub').innerHTML=o.subscription?`<div class="role-row"><span><strong>${esc(o.subscription.plan.name)}</strong><small>${esc(o.subscription.plan.description||'')}</small></span><span class="role-badge success">${esc(o.subscription.status)}</span></div><div style="margin-top:12px"><a class="role-btn" href="#subscription">View plans</a></div>`:'<div class="role-alert">No active subscription. Choose a platform plan to activate your business.</div><div style="margin-top:12px"><a class="role-btn" href="#subscription">Choose a plan</a></div>';}catch(e){app.innerHTML=`<div class="role-card role-alert error">${esc(e.message)}</div>`;}}
async function subscription(){app.innerHTML='<section class="role-head"><div><h1>Plans & Subscription</h1><p>Choose an active platform plan. Platform plans are created only by Super Admin.</p></div></section><div class="role-grid" id="plans">Loading…</div>';try{const [{data:o},{data:plans}]=await Promise.all([api('/tenant/overview'),api('/tenant/plans')]);document.querySelector('#plans').innerHTML=plans.map(p=>`<article class="role-card"><div class="role-label">${p.id===o.subscription?.planId?'Current plan':'Platform plan'}</div><h2>${esc(p.name)}</h2><p>${esc(p.description||'')}</p><div class="role-value small">${esc(p.currency)} ${Number(p.price||0).toFixed(2)} <span class="role-label">/ ${esc(p.interval)}</span></div><div style="margin-top:15px"><button class="role-btn" data-plan="${esc(p.id)}" ${p.id===o.subscription?.planId?'disabled':''}>${p.id===o.subscription?.planId?'Current plan':'Choose plan'}</button></div></article>`).join('')||'<div class="role-card">No active plans are available.</div>';document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/tenant/subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({planId:b.dataset.plan})});await subscription();}catch(e){b.disabled=false;alert(e.message);}});}catch(e){document.querySelector('#plans').innerHTML=`<div class="role-card role-alert error">${esc(e.message)}</div>`;}}
function route(){const r=location.hash.slice(1)||'dashboard';(r==='subscription'?subscription:dashboard)();}addEventListener('hashchange',route);route();
</script></body></html>
