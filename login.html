<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign In | N&amp;D's Air Conditioning &amp; Refrigeration</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .auth-page{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--bg-color,#f5f7fa)}
    .auth-card{width:min(100%,440px);background:#fff;border-radius:16px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
    .auth-brand{text-align:center;margin-bottom:24px}.auth-brand img{width:72px;height:72px;object-fit:contain}.auth-brand h1{font-size:24px;margin:12px 0 4px}.auth-brand p{margin:0;color:#667085}
    .auth-field{margin-bottom:16px}.auth-field label{display:block;font-weight:600;margin-bottom:7px}.auth-field input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}
    .auth-submit{width:100%;border:0;cursor:pointer}.auth-submit[disabled]{opacity:.65;cursor:wait}.auth-message{margin-bottom:16px;padding:12px;border-radius:8px;display:none}.auth-message.error{display:block;background:#fef3f2;color:#b42318}.auth-message.success{display:block;background:#ecfdf3;color:#027a48}
    .auth-footer{text-align:center;margin-top:20px}.auth-footer a{color:inherit;font-weight:600}.auth-back{display:inline-block;margin-top:8px}
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="loginTitle">
      <div class="auth-brand">
        <img src="/assets/logo.png" alt="N&amp;D's Air Conditioning and Refrigeration">
        <h1 id="loginTitle">Sign in</h1>
        <p>Access your N&amp;D's account</p>
      </div>

      <div id="authMessage" class="auth-message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submitButton" class="btn-primary auth-submit" type="submit">Sign in</button>
      </form>

      <div class="auth-footer">
        <a class="auth-back" href="/">Back to N&amp;D's website</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { auth, store, ApiError } from '/admin/js/api.js';

    const form = document.getElementById('loginForm');
    const message = document.getElementById('authMessage');
    const button = document.getElementById('submitButton');

    const requestedNext = () => {
      const value = new URLSearchParams(location.search).get('next');
      return value && value.startsWith('/') && !value.startsWith('//') ? value : null;
    };

    const roleHome = (user) => {
      if (user?.role === 'SUPER_ADMIN') return '/admin/#/platform';
      if (user?.role === 'TENANT_ADMIN') return '/admin/#/';
      if (user?.role === 'CUSTOMER') return '/customer/';
      return '/admin/';
    };

    const destination = (user) => requestedNext() || roleHome(user);

    const showMessage = (text, type = 'error') => {
      message.textContent = text;
      message.className = `auth-message ${type}`;
    };

    if (store.get().accessToken) {
      try {
        const user = await auth.me();
        location.replace(destination(user));
      } catch {
        store.clear();
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.className = 'auth-message';

      const email = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) {
        showMessage('Please enter your email address and password.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Signing in…';
      try {
        await auth.login(email, password);
        const user = await auth.me();
        showMessage('Signed in successfully. Redirecting…', 'success');
        location.replace(destination(user));
      } catch (error) {
        const text = error instanceof ApiError && error.status === 429
          ? error.message
          : (error?.message || 'Unable to sign in. Please check your email and password.');
        showMessage(text);
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
