<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Dashboard · N&D'S Admin</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/admin.css">
<script>
  // Applied before first paint to avoid a light-mode flash.
  (function () {
    var t = localStorage.getItem('nds.theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<noscript>
  <div class="alert alert--error" style="margin:20px">
    JavaScript is required to use the admin dashboard.
  </div>
</noscript>

<script type="module">
  import { requireAuth } from './js/api.js';
  import { boot } from './js/layout.js';

  (async () => {
    const user = await requireAuth();

  if (!user) {
    location.replace('/admin/login.html');
    return;
  }
    if (user.role !== 'ADMIN' && user.role !== 'STAFF') {
      const homes = { SUPER_ADMIN: '../superadmin/', TENANT_ADMIN: '../tenant/', TECHNICIAN: '../technician/', CUSTOMER: '../customer/' };
      location.replace(homes[user.role] || '../login.html');
      return;
    }
    boot();
  })();
</script>
