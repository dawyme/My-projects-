name: N&D'S AI Agent Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nds_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nds_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nds_test
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Apply database schema
        run: npx prisma db push --schema backend/prisma/schema.prisma --skip-generate

      - name: Seed test database
        run: node backend/prisma/seed.js

      - name: Run tests
        run: npm test
