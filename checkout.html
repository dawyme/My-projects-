<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - N&amp;D's</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;family=Open+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo"><a href="index.html"><img src="assets/logo.png" alt="N&amp;D's" class="site-logo" width="512" height="512"></a></div>
                <nav class="main-nav">
                    <button class="nav-toggle"><span class="hamburger"></span></button>
                    <ul class="nav-menu" id="primary-menu">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products/index.html">Products</a></li>
                        <li><a href="cart.html">Cart</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="page-header">
        <div class="container"><h1>Checkout</h1></div>
    </section>

    <section style="padding:60px 0;">
        <div class="container">
            <div style="max-width:1100px; margin:0 auto; display:grid; grid-template-columns:1fr 380px; gap:50px;">
                <!-- Order Summary -->
                <div>
                    <h3 style="margin-bottom:20px;">Order Summary</h3>
                    <div id="checkoutSummary"></div>
                </div>

                <!-- Checkout Form -->
                <div style="background:#f8f9fa; padding:30px; border-radius:16px;">
                    <h3 style="margin-bottom:25px;">Shipping &amp; Payment</h3>
                    <form id="checkoutForm">
                        <div class="form-group"><label>Full Name</label><input type="text" required></div>
                        <div class="form-group"><label>Address</label><input type="text" required></div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                            <div class="form-group"><label>City</label><input type="text" required></div>
                            <div class="form-group"><label>Phone</label><input type="tel" required></div>
                        </div>
                        
                        <div style="margin:25px 0 10px;">
                            <label style="font-weight:600;">Payment Method</label>
                            <div style="margin-top:12px;">
                                <label style="display:block; margin:8px 0;"><input type="radio" name="payment" checked> Credit / Debit Card</label>
                                <label style="display:block; margin:8px 0;"><input type="radio" name="payment"> Bank Transfer</label>
                                <label style="display:block; margin:8px 0;"><input type="radio" name="payment"> Cash on Delivery</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-primary" style="width:100%; margin-top:20px; padding:16px;">Complete Purchase</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container"><div class="footer-bottom"><p>© 2026 N&amp;D's. All rights reserved.</p></div></div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        function loadCheckoutSummary() {
            const container = document.getElementById('checkoutSummary');
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            if (!cart.length) {
                container.innerHTML = `<p>Your cart is empty. <a href="products/index.html">Continue shopping</a></p>`;
                return;
            }
            
            let html = `<div style="border:1px solid #eee; border-radius:12px; padding:20px;">`;
            let subtotal = 0;
            
            cart.forEach(item => {
                const lineTotal = item.price * (item.quantity || 1);
                subtotal += lineTotal;
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span>${item.name} × ${item.quantity || 1}</span><span>$${lineTotal}</span></div>`;
            });
            
            html += `<div style="border-top:1px solid #ddd; padding-top:16px; margin-top:16px; font-weight:700; display:flex; justify-content:space-between;"><span>Subtotal</span><span>$${subtotal}</span></div>`;
            html += `</div>`;
            container.innerHTML = html;
        }
        
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you! Your order has been placed. You will receive a confirmation email shortly.');
            localStorage.removeItem('cart');
            window.location.href = 'index.html';
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            loadCheckoutSummary();
            if (window.updateCartCount) window.updateCartCount();
        });
    </script>
</body>
</html>
